<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#202738"/>
    </linearGradient>
    <linearGradient id="hornGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- 徽标背景底板：深色圆角方块，适配浅色与深色浏览器标签页 -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)"/>
  <rect width="32" height="32" rx="7.5" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.8"/>

  <!-- 谛听主体图案：神兽灵耳 + 黄金独角 (洞察先机、牛市冲天) -->
  <!-- 灵耳外轮廓 (朱砂红) -->
  <path d="M 12.5 7 C 8 7 5.5 11 5.5 15 C 5.5 20 8.5 22.5 10.5 24.5 C 11.8 25.8 12.5 26.7 12.5 28 C 12.5 29 11.8 29.5 10.8 29.5 C 9.5 29.5 8.5 28.5 8 27.5 C 7.5 26.5 6.5 26.5 6.5 27.5 C 6.5 29.3 8.2 31 10.8 31 C 13.5 31 15 29.3 15 27.3 C 15 25.3 13.8 23.7 12.2 22.3 C 9.8 20.3 8 18.3 8 15 C 8 12.3 9.8 9.5 12.5 9.5 C 13.8 9.5 14.8 10 15.5 10.7 L 17 9.3 C 15.8 7.9 14.2 7 12.5 7 Z"
        fill="url(#earGrad)"/>

  <!-- 耳内声波纹 -->
  <path d="M 12 13 C 10.8 13 9.8 14.3 9.8 16 C 9.8 17.7 10.8 19 12 19"
        fill="none" stroke="#ff8787" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 黄金神角 (向上凌厉昂首，牛市锐进) -->
  <path d="M 11 17 C 11.5 14.5 13.5 10 20 6 C 24 3.5 25.5 1.5 26 1 C 26 2 25.2 6 23 9.5 C 20.8 13 17.5 16 13.5 17.5 C 12.2 18 11.2 17.7 11 17 Z"
        fill="url(#hornGrad)"/>

  <!-- 灵眸聚焦点 -->
  <circle cx="12.5" cy="16" r="1.2" fill="#ffffff"/>
</svg>