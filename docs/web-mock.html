  { key: "P5", name: "量化小张", kind: "发帖", bar: "北证50", time: "2026-09-13 15:05:12",
    content: "北交所今天成交额创月内新高，微盘风格有回归迹象，但 9 月的季节性不太支持，先观察两天。" },
  { key: "P6", name: "半仓过节", kind: "发帖", bar: "上证指数", time: "2026-09-12 15:02:44",
    content: "收盘了。这周就一句话：不追高，不割肉，持币过节。" },
];
const WEEK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const weekday = d => WEEK[new Date(d + "T00:00:00").getDay()];
const TODAY = "2026-09-14";

/* ---- 小图标 ---- */
const I = {
  pause: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>,
  play:  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>,
  gear:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>,
  trash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>,
  bell:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>,
  moon:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>,
  power: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18.4 6.6a9 9 0 1 1-12.8 0M12 2v10"/></svg>,
  down:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>,
  menu:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>,
  more:  <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>,
  sun:   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>,
  chev:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg>,
  mute:  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="12" height="12"><path d="M13.7 21a2 2 0 0 1-3.4 0M18.6 13A17 17 0 0 1 18 8a6 6 0 0 0-9.3-5M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14M1 1l22 22"/></svg>,
};

function Card({ it, user, open, onToggle }) {
  const k = KINDS[it.kind];
  const cls = ["card", it.isNew && "new", open && "open", it.kind === "追加" && "append"].filter(Boolean).join(" ");
  const style = user?.color ? { "--uc": user.color } : {};
  return (
    <div className={cls} style={style} tabIndex={0} onClick={onToggle}
         onKeyDown={e => (e.key === "Enter" || e.key === " ") && onToggle()}>
      <div className="stripe"/>
      <div className="body">
        <div className="head">
          <span className="uname">{it.name}</span>
          <span className="pill" style={{ "--kbg": k.bg, "--kfg": k.fg }}>{it.kind}</span>
          <span className="bar">{it.bar}</span>
          <time className="t">{it.time.slice(11, 16)}</time>
        </div>
        {it.ctx && (
          <div className="ctx">
            {it.kind === "评论" ? "评论" : it.kind === "转发" ? `转发自 ${it.ctxUser}` : "追加于"}
            <b>《{it.ctx}》</b>
          </div>
        )}
        <div className="txt">{it.content}</div>
        {open && (
          <div className="foot">
            <a href="#" onClick={e => e.stopPropagation()}>打开原帖 ↗</a>
            <span>{it.time}</span>
            <span>{it.key}</span>
          </div>
        )}
      </div>
    </div>
  );
}

function Drawer({ onClose }) {
  const [pend, setPend] = useState(() => Object.fromEntries(USERS.map(u => [u.name, { ...u }])));
  const upd = (nm, patch) => setPend(p => ({ ...p, [nm]: { ...p[nm], ...patch } }));
  return (
    <>
      <div className="scrim" onClick={onClose}/>
      <aside className="drawer" role="dialog" aria-label="用户设置">
        <header>
          <div>
            <h3>用户设置</h3>
            <p>配色 · 静音 · 查追加 — 改动保存后立刻生效，不用重启</p>
          </div>
          <span className="spacer"/>
          <button className="btn quiet" onClick={onClose}>关闭</button>
        </header>
        <div className="legend">
          {PALETTE.map(([nm, hx]) => <span key={hx}><i style={{ "--c": hx }}/>{nm}</span>)}
        </div>
        <div className="list">
          {USERS.map(u => {
            const p = pend[u.name];
            return (
              <div className="srow" key={u.uid} style={p.color ? { "--uc": p.color } : {}}>
                <div className="who"><b>{u.name}</b><span>{u.uid}</span></div>
                <div className="swatches">
                  <button className={"swatch none" + (!p.color ? " on" : "")} title="默认（按类型配色）"
                          onClick={() => upd(u.name, { color: null })}>默认</button>
                  {PALETTE.map(([nm, hx]) => (
                    <button key={hx} className={"swatch" + (p.color === hx ? " on" : "")} title={nm}
                            style={{ "--c": hx }} onClick={() => upd(u.name, { color: hx })}/>
                  ))}
                </div>
                <div className="toggles">
                  <label className={"tg" + (p.mute ? " on" : "")} onClick={() => upd(u.name, { mute: !p.mute })}><i/>静音</label>
                  <label className={"tg" + (p.check_appends ? " on" : "")} onClick={() => upd(u.name, { check_appends: !p.check_appends })}><i/>查追加</label>
                </div>
              </div>
            );
          })}
        </div>
        <footer>
          <button className="btn" onClick={onClose}>取消</button>
          <button className="btn primary" onClick={onClose}>保存</button>
        </footer>
      </aside>
    </>
  );
}

function App() {
  const [running, setRunning] = useState(true);
  const [dark, setDark] = useState(false);
  const [drawer, setDrawer] = useState(false);
  const [userF, setUserF] = useState(null);
  const [kindOff, setKindOff] = useState(new Set());
  const [collapsed, setCollapsed] = useState(new Set(["2026-09-12"]));
  const [openKey, setOpenKey] = useState("A1");
  // 侧栏收起状态：记住上次选择；第一次打开时窄屏（竖屏副屏）默认收起
  const [rail, setRail] = useState(() => {
    try { const v = localStorage.getItem("diting.rail"); if (v !== null) return v === "1"; } catch (e) {}
    return window.innerWidth < 900;
  });
  const [menu, setMenu] = useState(false);
  React.useEffect(() => { try { localStorage.setItem("diting.rail", rail ? "1" : "0"); } catch (e) {} }, [rail]);
  React.useEffect(() => {
    if (!menu) return;
    const h = () => setMenu(false);
    window.addEventListener("click", h); return () => window.removeEventListener("click", h);
  }, [menu]);

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }, [dark]);

  const byUser = useMemo(() => Object.fromEntries(USERS.map(u => [u.name, u])), []);
  const todayCount = useMemo(() => {
    const m = {}; ITEMS.filter(i => i.time.startsWith(TODAY)).forEach(i => m[i.name] = (m[i.name] || 0) + 1); return m;
  }, []);
  const shown = ITEMS.filter(i => (!userF || i.name === userF) && !kindOff.has(i.kind));
  const groups = useMemo(() => {
    const g = {}; shown.forEach(i => (g[i.time.slice(0, 10)] ||= []).push(i));
    return Object.entries(g).sort((a, b) => b[0].localeCompare(a[0]));
  }, [shown]);
  const toggleKind = k => setKindOff(s => { const n = new Set(s); n.has(k) ? n.delete(k) : n.add(k); return n; });
  const toggleDate = d => setCollapsed(s => { const n = new Set(s); n.has(d) ? n.delete(d) : n.add(d); return n; });

  return (
    <div className={"app" + (rail ? " rail" : "")}>
      <header className="topbar">
        <div className="brand">
          <button className="iconbtn" title={rail ? "展开侧栏" : "收起侧栏"} onClick={() => setRail(r => !r)}>{I.menu}</button>
          <span className="brand-mark">谛听</span>
        </div>
        <div className="status" title={running ? "运行中 · 上次检查 14:32:05" : "已暂停"}>
          <span className={"dot" + (running ? "" : " paused")}/>
          <span className="lbl">{running ? "运行中" : "已暂停"} · 上次检查</span> <time>14:32:05</time>
        </div>
        <span className="spacer"/>
        <div className="tb-actions">
          <button className="btn" title={running ? "停止监控" : "开始监控"} onClick={() => setRunning(r => !r)}>
            {running ? I.pause : I.play}<span className="lbl">{running ? "停止监控" : "开始监控"}</span>
          </button>
          <button className="btn" title="用户设置" onClick={() => setDrawer(true)}>{I.gear}<span className="lbl">设置</span></button>
          <button className="btn quiet only-wide" title="测试通知">{I.bell}</button>
          <button className="btn quiet only-wide" title="清空列表">{I.trash}</button>
          <button className="btn quiet only-wide" title="深色模式" onClick={() => setDark(d => !d)}>{dark ? I.sun : I.moon}</button>
          <button className="btn quiet only-wide" title="退出程序">{I.power}</button>
          <div className="menu-wrap only-narrow">
            <button className="btn quiet" title="更多" onClick={e => { e.stopPropagation(); setMenu(m => !m); }}>{I.more}</button>
            {menu && (
              <div className="menu" onClick={e => e.stopPropagation()}>
                <button>{I.bell}测试通知</button>
                <button>{I.trash}清空列表</button>
                <button onClick={() => setDark(d => !d)}>{dark ? I.sun : I.moon}{dark ? "浅色模式" : "深色模式"}</button>
                <hr/>
                <button className="danger">{I.power}退出程序</button>
              </div>
            )}
          </div>
        </div>
      </header>

      <nav className="side">
        <div>
          <h4>监控用户</h4>
          <div className="ulist">
            <button className={"urow" + (!userF ? " on" : "")} onClick={() => setUserF(null)} title="全部用户">
              <span className="sw" style={{ background: "var(--line-strong)" }}/>
              <span className="nm"><span>全部</span></span>
              <span className="cnt">{ITEMS.filter(i => i.time.startsWith(TODAY)).length}</span>
            </button>
            {USERS.map(u => (
              <button key={u.uid} className={"urow" + (userF === u.name ? " on" : "")} onClick={() => setUserF(u.name)} title={u.name + "（今日 " + (todayCount[u.name] || 0) + " 条）"}>
                <span className="sw" style={{ background: u.color || "var(--line-strong)" }}/>
                <span className="nm"><span>{u.name}</span>{u.mute && I.mute}{u.check_appends && <span className="tag-mini">追加</span>}</span>
                <span className="cnt">{todayCount[u.name] || 0}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="divider"/>
        <div>
          <h4>动态类型</h4>
          <div className="kinds">
            {Object.entries(KINDS).map(([k, c]) => (
              <button key={k} className={"chip " + (kindOff.has(k) ? "off" : "on")}
                      style={{ "--c": c.fg, "--kbg": c.bg }} onClick={() => toggleKind(k)} title={k}><i/><span>{k}</span></button>
            ))}
          </div>
        </div>
        <div className="side-foot">
          轮询间隔 <b>60 s</b> · 查追加 <b>300 s</b><br/>
          已存 <b>1,284</b> 条 · messages.db
        </div>
      </nav>

      <main className="main">
        <div className="feed">
          {groups.map(([d, list]) => (
            <section key={d}>
              <div className="dhead">
                <button onClick={() => toggleDate(d)}>
                  <span className={"chev" + (collapsed.has(d) ? " closed" : "")}>{I.chev}</span>
                  <span className="d">{d === TODAY ? "今天" : d}</span>
                  <span className="wk">{weekday(d)}{d === TODAY ? " · " + d : ""}</span>
                </button>
                <span className="n">{list.length}</span>
                <span className="rule"/>
              </div>
              {!collapsed.has(d) && (
                <div className="cards">
                  {list.map(it => (
                    <Card key={it.key} it={it} user={byUser[it.name]} open={openKey === it.key}
                          onToggle={() => setOpenKey(k => k === it.key ? null : it.key)}/>
                  ))}
                </div>
              )}
            </section>
          ))}
        </div>
        <button className="fab">{I.down}<span>2 条新动态</span></button>
      </main>

      {drawer && <Drawer onClose={() => setDrawer(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
